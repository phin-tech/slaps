# The release tool, app-release (https://git.phin.tech/sam/app-release), pinned to a tag; what it knows about
# Slaps is in release.toml. To move to a newer app-release, change the tag, then
# `uv lock --upgrade-package app-release --project scripts/release`. app-release is private, so uv's git clone needs
# a credential for https://git.phin.tech (a Forgejo token in a git credential helper).
[project]
name = "slaps-release"
version = "0"
requires-python = ">=3.12"
dependencies = ["app-release"]

[tool.uv]
package = false

[tool.uv.sources]
app-release = { git = "https://git.phin.tech/sam/app-release", tag = "v1.6.1" }
